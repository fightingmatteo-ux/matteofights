<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/lib/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #000; }
      .full { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      #cam { position: absolute; inset: 0; overflow: hidden; }
      #cam-inner { position: absolute; inset: 0; transform-origin: 50% 100%; }
      /* hook title: on frame 0 (it is the thumbnail), inside the grid crop */
      #title { position: absolute; left: 70px; right: 70px; top: 250px; text-align: center; font-family: "Geist", sans-serif; color: #fff;
        text-shadow: 0 2px 6px rgba(0,0,0,0.45), 0 8px 34px rgba(0,0,0,0.4); }
      #title .lead { display: block; font-weight: 700; font-size: 70px; line-height: 1.05; letter-spacing: -0.035em; }
      /* the big word sits BEHIND his head: A-roll -> #behind -> cut-out (fg_A.webm), all inside the camera */
      /* on "head" it jumps through him: #behind (under the cut-out) hands over to #front-head (over it) */
      #behind, #front-head { position: absolute; left: 0; right: 0; top: {{BEHIND_TOP}}px; text-align: center; font-family: "Geist", sans-serif;
        font-weight: 800; font-size: 360px; line-height: 0.8; letter-spacing: -0.065em; color: #E8112D; white-space: nowrap; }
      #front-head { text-shadow: 0 4px 10px rgba(0,0,0,0.45), 0 14px 44px rgba(0,0,0,0.4); }
      {{ED_CSS}}
      :root { --ed-cap-top: {{CAP_TOP}}px; --ed-back-top: {{BACK_TOP}}px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{DUR}}" data-width="1080" data-height="1920">
      <div id="cam"><div id="cam-inner">
        <video id="aroll" class="clip full" src="assets/media/aroll_A.mp4" data-start="0" data-duration="{{DUR}}" data-track-index="0" muted playsinline></video>
        <div id="behind" class="clip" data-start="0" data-duration="{{HEAD_SWAP}}" data-track-index="1">head.</div>
        <div id="ed-caps-back">
        {{ED_HTML_CAPS_BACK}}
        </div>
        <video id="fg" class="clip full" src="assets/media/fg_A_full.webm" data-start="0" data-duration="{{DUR}}" data-track-index="2" muted playsinline></video>
        <div id="front-head" class="clip" data-start="{{HEAD_SWAP}}" data-duration="{{FRONT_DUR}}" data-track-index="3">head.</div>
      </div></div>

      <div id="title" class="clip" data-start="0" data-duration="{{TITLE_END}}" data-track-index="5">
        <span class="lead">If you freeze when you spar,</span><span class="lead">it's your</span>
      </div>

      <div id="ed-caps">
      {{ED_HTML_CAPS}}
      </div>
      {{ED_HTML_CARDS}}
      <div id="ed-flash"></div>
      <div id="ed-dip"></div>

      <audio id="vo" src="assets/media/aroll_A.mp4" data-start="0" data-duration="{{DUR}}" data-track-index="10" data-volume="1"></audio>
      {{ED_AUDIO}}
      <audio id="sfx-head" src="assets/sfx/ed/punch.wav" data-start="{{HEAD_SFX}}" data-duration="0.34" data-track-index="26" data-volume="0.55"></audio>
    </div>

    <script>{{ED_JS}}</script>
    <script>
      const PLAN = {{ED_PLAN}};
      const tl = gsap.timeline({ paused: true });
      // the title is already up on frame 0; "head" settles in as he says it, then the title softens away
      // "head": the word punches through him, from behind his hair to in front of it
      tl.fromTo("#front-head", { opacity: 0, scale: 0.9, filter: "blur(8px)" }, { opacity: 1, scale: 1.12, filter: "blur(0px)", duration: 0.1, ease: "power3.out" }, {{HEAD_SWAP}});
      tl.to("#front-head", { scale: 1, duration: 0.22, ease: "power2.out" }, {{HEAD_SWAP}} + 0.1);
      tl.fromTo("#cam", { scale: 1 }, { scale: 1.03, duration: 0.06, ease: "power2.out", immediateRender: false }, {{HEAD_SWAP}});
      tl.to("#cam", { scale: 1, duration: 0.2, ease: "power2.out" }, {{HEAD_SWAP}} + 0.06);
      tl.to("#title", { opacity: 0, y: -20, filter: "blur(10px)", duration: 0.12, ease: "power1.in" }, {{TITLE_END}} - 0.12);
      tl.to("#front-head", { opacity: 0, filter: "blur(10px)", duration: 0.12, ease: "power1.in" }, {{TITLE_END}} - 0.12);
      Editorial.animate(tl, PLAN, { cam: "#cam-inner", shake: "#cam" });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
