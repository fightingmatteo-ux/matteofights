<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Bebas Neue"; src: url("assets/BebasNeue-Regular.woff2") format("woff2"); font-display: block; }
      @font-face { font-family: "Geist Mono"; src: url("assets/GeistMono.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0B0B0D; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #0B0B0D; }
      #face { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 86% 50%; filter: brightness(0.9) contrast(1.06) saturate(1.05); }
      #shade { position: absolute; left: 0; right: 0; top: 0; height: 560px; background: rgba(11,11,13,0.55); }
      #title { position: absolute; left: 50px; right: 50px; top: 1060px; text-align: center; font-family: "Bebas Neue", sans-serif; }
      #title span { display: block; line-height: 0.86; -webkit-text-stroke: 16px #0B0B0D; paint-order: stroke fill; }
      .r { color: #FF1E1E; font-size: 330px; }
      .w { color: #F2F0EA; font-size: 158px; }
      #tag { position: absolute; left: 0; right: 0; top: 1660px; display: flex; justify-content: center; gap: 12px; font-family: "Geist Mono", monospace; font-weight: 700; font-size: 34px; letter-spacing: 0.1em; }
      #tag span { background: #0B0B0D; color: #F2F0EA; padding: 12px 18px; }
      #tag span.hot { background: #C82020; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="1" data-width="1080" data-height="1920">
      <img id="face" class="clip" src="assets/ring.jpg" alt="" data-start="0" data-duration="1" data-track-index="0" />
      <div id="title" class="clip" data-start="0" data-duration="1" data-track-index="2"><span class="r">WORST</span><span class="w">FIGHTING DECISION</span><span class="w">OF MY LIFE</span></div>
      <div id="tag" class="clip" data-start="0" data-duration="1" data-track-index="3"><span>BJJ</span><span class="hot">PAVEMENT</span><span>6 MONTHS REHAB</span></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
