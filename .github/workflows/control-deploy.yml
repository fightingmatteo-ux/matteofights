# Deploys the control center (control.matteofights.me) to Cloudflare Pages: rebuilds data.json from the repo, then
# uploads control-site/public + control-site/functions. Runs on every push to master, and when a workflow that
# commits to production/ actually changed master (its last step dispatches this; GITHUB_TOKEN pushes don't trigger
# "push"). Was workflow_run after every run: ~50 deploys a day, most with nothing new (changed 2026-10-17).
name: Deploy control center

on:
  push:
    branches: [master]
  workflow_dispatch:

# Every run builds the latest master, so a newer run can replace an older one.
concurrency:
  group: control-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master
      - name: ffmpeg (shrinks renders over the 25 MiB Pages limit into previews)
        run: command -v ffmpeg > /dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null)
      - name: Build data (+ copy upcoming reel videos from the media release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -P tools/control/build_data.py
      - name: Version the app files (so a refresh always loads the latest code)
        run: sed -i "s/app\.js\"/app.js?v=${GITHUB_SHA::7}-${GITHUB_RUN_NUMBER}\"/; s/style\.css\"/style.css?v=${GITHUB_SHA::7}-${GITHUB_RUN_NUMBER}\"/" control-site/public/index.html
      - name: Upload to Cloudflare Pages
        working-directory: control-site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >
          npx --yes wrangler@4.149.0 pages deploy public
          --project-name matteo-control --branch master
          --commit-hash "$(git rev-parse HEAD)" --commit-message "$(git log -1 --format=%s | cut -c1-100)"
