# Deploys the control center (control.matteofights.me) to Cloudflare Pages: rebuilds data.json from the repo, then
# uploads control-site/public + control-site/functions. Runs on every push to master and after the workflows that
# commit to production/ (their pushes use GITHUB_TOKEN, which doesn't trigger "push" workflows).
name: Deploy control center

on:
  # Free-tier budget (2026-10-25): this used to run on EVERY push + after 7 workflows (~1,200 min in 5 days, the
  # main reason the account ran out of Actions minutes). Now: dashboard code changes, approvals, and a data refresh
  # every 6 h. Need fresh data now? Run it by hand.
  push:
    branches: [master]
    paths: ["control-site/**", "tools/control/**", ".github/workflows/control-deploy.yml"]
  workflow_run:
    workflows: [Control, Post trial reel]
    types: [completed]
  schedule:
    - cron: "50 */6 * * *"
  workflow_dispatch:

# Every run builds the latest master, so a newer run can replace an older one.
concurrency:
  group: control-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_D1_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}   # tools/state.py when cloud.json says d1
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: ffmpeg (shrinks reel previews over the 25 MiB Pages limit)
        run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: Build data (+ copy upcoming reel videos from the media release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -P tools/control/build_data.py
      - name: Version the app files (so a refresh always loads the latest code)
        run: sed -i "s/app\.js\"/app.js?v=${GITHUB_SHA::7}-${GITHUB_RUN_NUMBER}\"/; s/style\.css\"/style.css?v=${GITHUB_SHA::7}-${GITHUB_RUN_NUMBER}\"/" control-site/public/index.html
      - name: Upload to Cloudflare Pages
        working-directory: control-site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >
          npx --yes wrangler@4.149.0 pages deploy public
          --project-name matteo-control --branch master
          --commit-hash "$(git rev-parse HEAD)" --commit-message "$(git log -1 --format=%s | cut -c1-100)"
