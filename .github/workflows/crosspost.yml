# Every ~30 min (and after each Post queue run): sends reels that posted on Instagram to the enabled platforms in
# their own New York time slots, plus Facebook listicle slides and approved written Threads posts.
# tools/crosspost/crosspost.py run. State + results: production/schedule/crosspost.json, production/threads/posts.json.
name: Cross-post

on:
  schedule:
    - cron: "15 */6 * * *"  # backup only: the Cloudflare ticker starts it at every cross-post slot (free-tier budget 2026-10-25)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crosspost
  cancel-in-progress: false

jobs:
  crosspost:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_D1_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}   # tools/state.py when cloud.json says d1
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Lock (one runner at a time, tools/ops/lock.py)
        id: lock
        run: python3 -P tools/ops/lock.py acquire crosspost
      - name: Cross-post
        if: steps.lock.outputs.go == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}         # videos in R2 get a 6 h presigned link
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python3 -m pip install -q pillow boto3 && python3 -P tools/crosspost/crosspost.py run
      - name: Save results and tell Matteo
        if: always() && steps.lock.outputs.go == 'yes'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          git config user.name "crosspost[bot]"
          git config user.email "crosspost@users.noreply.github.com"
          git add production/schedule/crosspost.json production/control production/threads
          if ! git diff --cached --quiet; then
            git commit -qm "crosspost: results"
            for n in 1 2 3; do git pull --rebase -q origin master && git push -q origin HEAD:master && break; sleep 5; done
          fi
          python3 -m pip install -q pillow 2>/dev/null || true
          python3 -P tools/control/control.py notify || echo "telegram notify failed (non-fatal)"
          git add production/control
          git diff --cached --quiet && exit 0
          git commit -qm "control: telegram sent"
          for n in 1 2 3; do git pull --rebase -q origin master && git push -q origin HEAD:master && break; sleep 5; done
      - name: Mirror state to D1
        if: always() && steps.lock.outputs.go == 'yes'
        continue-on-error: true
        env:
          CLOUDFLARE_D1_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
        run: |
          git pull --rebase -q origin master || true
          python3 -P tools/state_mirror.py sync
      - name: Release lock
        if: always() && steps.lock.outputs.go == 'yes'
        run: python3 -P tools/ops/lock.py release crosspost
