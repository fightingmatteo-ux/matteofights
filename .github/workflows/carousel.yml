# Carousels (swipe posts): pull still frames from the Drive training clips (tools/carousel/frames.py) so Claude can
# pick a photo per slide. Rendering and posting come next (tools/carousel/README.md).
name: Carousel

on:
  workflow_dispatch:
    inputs:
      frames:
        description: Drive clip ids to pull frames from (comma-separated)
        required: true
      per_clip:
        description: Frames to keep per clip
        default: "4"

permissions:
  contents: write

concurrency:
  group: carousel
  cancel-in-progress: false

jobs:
  frames:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg, rclone, Pillow
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          curl -fsSL https://rclone.org/install.sh | sudo bash > /dev/null
          python3 -m pip install -q pillow
      - name: rclone config
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: mkdir -p ~/.config/rclone && printf '%s\n' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
      - name: Frames
        env:
          CLIPS: ${{ inputs.frames }}
          PER_CLIP: ${{ inputs.per_clip }}
        run: python3 -P tools/carousel/frames.py "$CLIPS" --per-clip "$PER_CLIP"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add production/carousels/frames
          git commit -m "carousel: frames from Drive clips" || exit 0
          git pull --rebase -q origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
