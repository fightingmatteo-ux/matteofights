# Fetch a video by link (Instagram, TikTok, YouTube, Google Drive share link, or direct URL),
# "watch" it (frames, cuts, transcript) and commit the analysis to the repo.
# The video itself goes to the "media" release (see tools/video/media.sh).
#
# Run it: Actions tab -> Fetch video -> Run workflow (works from the GitHub mobile app),
# or ask Claude to trigger it.
#
# YouTube always and Instagram often block logged-out downloads from cloud IPs. yt-dlp uses YT_COOKIES (YouTube links)
# or IG_COOKIES (Instagram), each a Netscape cookies.txt from a logged-in browser (burner account).
# Instagram often blocks logged-out downloads from cloud IPs. yt-dlp uses the IG_COOKIES secret
# (Netscape cookies.txt) when set; if it still fails, Instagram links fall back to Business Discovery
# (tools/video/ig_discovery.py, FB_USER_TOKEN), which works for creator/business accounts.
# Instagram /p/ posts (carousels, photo posts) go to Business Discovery first: it saves every slide
# to <dir>/slides/NN.jpg; animated slides become NN/ frames + NN-contact.jpg, their mp4 goes to the media release.
name: Fetch video

on:
  workflow_dispatch:
    inputs:
      url:
        description: Video link
        required: true
      name:
        description: Short slug for the folder, e.g. legend-names-ref
        required: true
      kind:
        description: reference (someone else's) or footage (yours)
        type: choice
        options: [reference, footage]
        default: reference
      user:
        description: Instagram creator's username (optional; helps the API fallback find the reel)
        required: false

permissions:
  contents: write

concurrency:
  group: fetch-video
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      URL: ${{ inputs.url }}
      NAME: ${{ inputs.name }}
      KIND: ${{ inputs.kind }}
      IG_USER: ${{ inputs.user }}
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q -U "yt-dlp[default]" gdown faster-whisper
          # YouTube formats need a JS runtime for yt-dlp's challenge solver (yt-dlp EJS); Deno is its default
          curl -fsSL https://deno.land/install.sh | sh -s -- -y > /dev/null 2>&1 && echo "$HOME/.deno/bin" >> "$GITHUB_PATH"

      - name: Download
        env:
          IG_COOKIES: ${{ secrets.IG_COOKIES }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          FB_USER_TOKEN: ${{ secrets.FB_USER_TOKEN }}
        run: |
          case "$NAME" in *[!a-zA-Z0-9._-]*|"") echo "name must be a simple slug"; exit 1;; esac
          mkdir -p dl
          # /p/ posts are usually carousels: yt-dlp keeps only the first item, Business Discovery saves every slide
          if [[ "$URL" == *instagram.com/p/* ]] && python3 -P tools/video/ig_discovery.py "$URL" dl --user "$IG_USER"; then
            :
          elif [[ "$URL" == *drive.google.com* ]]; then
            # gdown >= 6 dropped --fuzzy; pass the bare file id
            id=$(printf '%s' "$URL" | sed -nE 's#.*/d/([^/?]+).*#\1#p; s#.*[?&]id=([^&]+).*#\1#p' | head -1)
            gdown "${id:-$URL}" -O dl/video
          else
            args=()
            # YouTube blocks GitHub runners ("confirm you're not a bot") unless a logged-in cookies.txt is passed
            if [[ "$URL" == *youtu* ]]; then C="$YT_COOKIES"; else C="$IG_COOKIES"; fi
            if [ -n "$C" ]; then printf '%s\n' "$C" > cookies.txt; args+=(--cookies cookies.txt); fi
            ytdl() { yt-dlp "$@" -f "bv*+ba/b" --merge-output-format mp4 --write-info-json -o "dl/video.%(ext)s" "$URL"; }
            # expired cookies make yt-dlp fail where a logged-out request can work, so retry without them
            if ! ytdl "${args[@]}" && { [ ${#args[@]} -eq 0 ] || ! ytdl; }; then
              # Instagram blocked yt-dlp: fall back to Business Discovery (Meta API, no cookies)
              [[ "$URL" == *instagram.com* ]] || exit 1
              rm -f dl/video*
              python3 -P tools/video/ig_discovery.py "$URL" dl --user "$IG_USER"
            fi
          fi
          f=$(ls dl/video* | grep -v '\.json$' | head -1 || true)
          if [ -z "$f" ]; then echo "NO_VIDEO=1" >> "$GITHUB_ENV"; exit 0; fi
          ffmpeg -v error -i "$f" -c copy -movflags +faststart "dl/$NAME.mp4" || cp "$f" "dl/$NAME.mp4"
          # colour test (name ending -colortest): one frame from the ORIGINAL, converted 4 ways, + the camera's colour tags
          if [[ "$NAME" == *-colortest ]]; then
            d=content-bank/real-footage/analysis/$NAME; mkdir -p "$d"
            ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,pix_fmt,color_range,color_space,color_transfer,color_primaries,profile:stream_side_data -of default "dl/$NAME.mp4" > "$d/probe.txt" || true
            for t in 80 376; do
              ffmpeg -v error -y -ss $t -i "dl/$NAME.mp4" -frames:v 1 -vf "scale=540:-2" "$d/t${t}_1_as-is.jpg" || true
              ffmpeg -v error -y -ss $t -i "dl/$NAME.mp4" -frames:v 1 -vf "zscale=t=linear:npl=100:tin=arib-std-b67:pin=bt2020:min=bt2020nc,format=gbrpf32le,zscale=p=bt709,tonemap=hable:desat=0,zscale=t=bt709:m=bt709:r=tv,scale=540:-2" "$d/t${t}_2_hable-current.jpg" || true
              ffmpeg -v error -y -ss $t -i "dl/$NAME.mp4" -frames:v 1 -vf "zscale=t=linear:npl=203:tin=arib-std-b67:pin=bt2020:min=bt2020nc,format=gbrpf32le,zscale=p=bt709,tonemap=mobius:desat=2,zscale=t=bt709:m=bt709:r=tv,scale=540:-2" "$d/t${t}_3_mobius.jpg" || true
              ffmpeg -v error -y -ss $t -i "dl/$NAME.mp4" -frames:v 1 -vf "zscale=pin=bt2020:p=bt709:min=bt2020nc:m=bt709:tin=bt709:t=bt709:r=tv,scale=540:-2" "$d/t${t}_4_primaries-only.jpg" || true
            done
            ls "$d"; cat "$d/probe.txt"
            git config user.name "github-actions[bot]"; git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add "$d" && git commit -qm "media: colour test $NAME" && git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}"
            exit 1   # stop here on purpose: a test, nothing to watch or store
          fi
          # release assets max out at 2 GB: a bigger original (4K DJI/iPhone take) becomes the prepped 1080x1920 master
          # the edit uses anyway (prep_footage.sh: neutral colour, no trim, so word timings hold)
          if [ "$(stat -c%s "dl/$NAME.mp4")" -gt 1990000000 ]; then
            rm -f "$f"
            bash production/editing/reel-kit/scripts/prep_footage.sh "dl/$NAME.mp4" dl/prepped.mp4
            mv dl/prepped.mp4 "dl/$NAME.mp4"; ls -la "dl/$NAME.mp4"
          fi

      - name: Watch
        run: |
          if [ "$KIND" = reference ]; then dir="content-bank/references/videos/$NAME"
          else dir="content-bank/real-footage/analysis/$NAME"; fi
          if [ -n "$NO_VIDEO" ]; then mkdir -p "$dir"; else python3 tools/video/watch.py "dl/$NAME.mp4" "$dir"; fi
          if [ -d dl/slides ]; then
            # animated (video) slides: frames + contact sheet go in git, the mp4 goes to the media release
            for v in dl/slides/*.mp4; do
              [ -e "$v" ] || continue
              n=$(basename "$v" .mp4)
              mkdir -p "dl/slides/$n"
              ffmpeg -v error -i "$v" -vf fps=2,scale=540:-2 "dl/slides/$n/f%03d.jpg"
              ffmpeg -v error -i "$v" -vf "fps=1,scale=270:-2,tile=5x2" -frames:v 1 "dl/slides/$n-contact.jpg"
              mv "$v" "dl/$NAME-slide$n.mp4"
            done
            cp -r dl/slides "$dir/"
          fi
          if [ -f dl/video.info.json ]; then
            python3 - "$dir" <<'PY'
          import json, sys
          i = json.load(open("dl/video.info.json"))
          keep = {k: i.get(k) for k in ["uploader", "uploader_id", "channel", "title", "description",
                  "timestamp", "view_count", "like_count", "comment_count", "webpage_url", "track", "artist", "followers",
                  "media_type"]}
          json.dump(keep, open(f"{sys.argv[1]}/source.json", "w"), indent=2, ensure_ascii=False)
          PY
          fi
          echo "DIR=$dir" >> "$GITHUB_ENV"

      - name: Store video on the media release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=()
          for f in "dl/$NAME.mp4" dl/"$NAME"-slide*.mp4; do [ -e "$f" ] && files+=("$f"); done
          [ ${#files[@]} -gt 0 ] || exit 0
          gh release view media > /dev/null 2>&1 || \
            gh release create media --title Media --notes "Raw footage, references and renders. Managed by tools/video/media.sh."
          gh release upload media "${files[@]}" --clobber

      - name: Commit analysis
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add "$DIR"
          git commit -m "media: watch $NAME ($KIND)"
          git pull --rebase -q origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
