# Mondays: measure the creators in production/competitors/accounts.json and flag their outliers
# (tools/competitors/scout.py -> production/competitors/outliers.json, shown under Results > Rivals in the control center).
# The "Competitor ideas" Claude routine turns new outliers into idea cards afterwards. Read-only on every platform.
name: Competitors

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: competitors
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master
      - run: python3 -m pip install -q yt-dlp
      - name: Measure
        env:
          FB_USER_TOKEN: ${{ secrets.FB_USER_TOKEN }}
        run: python3 -P tools/competitors/scout.py
      - name: Save
        run: |
          git config user.name "competitors[bot]"
          git config user.email "competitors@users.noreply.github.com"
          git add production/competitors/outliers.json
          git diff --cached --quiet && exit 0
          git commit -qm "competitors: outliers"
          for n in 1 2 3; do git pull --rebase -q origin master && git push -q origin HEAD:master && break; sleep 5; done
