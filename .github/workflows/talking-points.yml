# Weekly: Claude (Matteo's subscription) turns the competitor scout's outliers into talking points in his voice,
# shown on the dashboard (Studio). Instructions: tools/edit/TALKING-POINTS.md. Runs after the Monday scout.
name: Talking points
on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_D1_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: "Read tools/edit/TALKING-POINTS.md and do exactly what it says."
          claude_args: "--max-turns 60 --allowedTools Bash,Read,Glob,Grep,Skill"
