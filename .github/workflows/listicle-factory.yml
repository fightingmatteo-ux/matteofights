# Render the next listicle trial reels (tools/listicle/factory.py) from the training clips in Drive and add
# them to the post queue UNAPPROVED, one per day. Matteo watches them in Drive output/listicles/, says yes,
# then tools/instagram/approve.py flips them to approved and the Post queue workflow posts one a day.
# Runs every Sunday for the coming week, or on demand.
name: Listicle factory

on:
  schedule:
    - cron: "0 7 * * 6"    # Saturday: contact sheets for new Drive clips (Claude picks clips from them)
    - cron: "0 9 * * 0"    # Sunday: next week's 18:30 New York slot
    - cron: "40 9 * * 0"   # Sunday: next week's 21:30 New York slot
    - cron: "20 10 * * 0"  # Sunday: next week's 12:30 New York slot (3 a day since 2026-10-16)
  workflow_dispatch:
    inputs:
      count:
        description: How many reels to make (one per day)
        default: "7"
      slot:
        description: Daily post time, New York HH:MM (18:30 and 21:30 = US evening)
        default: "18:30"
      rerender:
        description: Re-render the queued, unapproved listicles in place (after a render change)
        type: boolean
        default: false
      only:
        description: With rerender, only these queue ids (comma-separated)
        default: ""
      sheets:
        description: Only make contact sheets for new Drive clips
        type: boolean
        default: false
      rematch:
        description: With rerender, let the footage agent re-pick every clip from the whole folder
        type: boolean
        default: false
      audio:
        description: "Instagram sound attached at post time ('Title - Artist'); 'none' = royalty-free music in the file"
        default: "Echo Sax End - Caleb Arredondo; id:607478755762707|783202424324531 INSONAMIA - Ronald Figo; Echo Sax End - Caleb Arredondo; id:534294096071090 Memory Reboot - VØJ, Narvent"

permissions:
  contents: write   # commit hooks/state/queue + captions/covers
  # release upload uses GH_TOKEN below

concurrency:
  group: post-queue   # same group as Post queue: never two writers on queue.json
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg, emoji font, rclone, Pillow
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-color-emoji libegl1 libgles2 > /dev/null
          curl -fsSL https://rclone.org/install.sh | sudo bash > /dev/null
          python3 -m pip install -q pillow anthropic mediapipe numpy
      - name: rclone config
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: mkdir -p ~/.config/rclone && printf '%s\n' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
      - name: Make the reels
        env:
          GH_TOKEN: ${{ github.token }}
          COUNT: ${{ inputs.count || '7' }}
          SLOT: ${{ github.event.schedule == '40 9 * * 0' && '21:30' || github.event.schedule == '20 10 * * 0' && '12:30' || inputs.slot || '18:30' }}
          RERENDER: ${{ inputs.rerender && '--rerender' || '' }}
          REMATCH: ${{ inputs.rematch && '--rematch' || '' }}
          SHEETS: ${{ (inputs.sheets || github.event.schedule == '0 7 * * 6') && '--sheets-only' || '' }}
          ONLY: ${{ inputs.only || '' }}
          # Matteo 2026-10-20: listicles do better on the sounds that carried his best ones (production/sounds/own_proven.json).
          # Rotated one per reel: Echo Sax End (5 of his top 15 incl. the 331k; artist's own upload) every other reel,
          # INSONAMIA (2 of the top 15): Matteo's official track 607478755762707 first (not in the API library 2026-10-20, so
          # the fan upload 783202424324531 is used until it is), Memory Reboot as a pinned fan upload.
          AUDIO: ${{ inputs.audio == 'none' && '' || inputs.audio || 'Echo Sax End - Caleb Arredondo; id:607478755762707|783202424324531 INSONAMIA - Ronald Figo; Echo Sax End - Caleb Arredondo; id:534294096071090 Memory Reboot - VØJ, Narvent' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # footage agent; without it: least-used clips
        run: python3 -P tools/listicle/factory.py --count "$COUNT" --slot "$SLOT" --only "$ONLY" --audio "$AUDIO" $RERENDER $REMATCH $SHEETS
      - name: Commit
        if: always()
        run: |
          git add production/listicles production/schedule/queue.json
          git diff --cached --quiet && exit 0
          git config user.name "listicle-factory[bot]"
          git config user.email "listicle-factory@users.noreply.github.com"
          git commit -qm "listicles: ${{ (inputs.sheets || github.event.schedule == '0 7 * * 6') && 'clip sheets; ' || '' }}${{ inputs.rerender && 're-rendered ' || '' }}$(python3 -c "import json;q=json.load(open('production/schedule/queue.json'));print(', '.join(i['id'] for i in q['items'] if i['id'].startswith('lst-') and not i['approved'] and i['status']=='queued'))") awaiting yes"
          for n in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
      - name: Telegram (anything new for Matteo)
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 -m pip install -q pillow 2>/dev/null || true
          git pull -q --rebase origin master || true
          python3 -P tools/control/control.py notify || echo "telegram notify failed (non-fatal)"
          git add production/control
          git diff --cached --quiet && exit 0
          git config user.name "control[bot]"
          git config user.email "control@users.noreply.github.com"
          git commit -qm "control: telegram sent"
          for n in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
