# Posts the next due, APPROVED item from production/schedule/queue.json (tools/instagram/run_queue.py).
# Runs every 30 min (GitHub cron can run late) and on demand. One post per run, never two runs at once.
# To post something: add it to queue.json, then set "approved": true only after Matteo's explicit yes.
name: Post queue

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write   # commit the queue status back

concurrency:
  group: post-queue
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Post next due item
        id: run
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          FB_USER_TOKEN: ${{ secrets.FB_USER_TOKEN }}   # Audio API: items with app_audio get the library sound attached
          GH_TOKEN: ${{ github.token }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}         # videos in R2 get a 6 h presigned link
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          python3 -m pip install -q boto3 || true
          python3 -P tools/instagram/run_queue.py
      - name: Save queue status
        if: always()
        run: |
          git diff --quiet production/schedule/queue.json && exit 0
          git config user.name "post-queue[bot]"
          git config user.email "post-queue@users.noreply.github.com"
          git add production/schedule/queue.json
          git commit -m "queue: $(python3 -c "import json;q=json.load(open('production/schedule/queue.json'));print(', '.join(i['id']+' '+i['status'] for i in q['items'] if i['status']!='queued'))")"
          for n in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
      - name: Telegram (anything new for Matteo)
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 -m pip install -q pillow 2>/dev/null || true
          git pull -q --rebase origin master || true
          python3 -P tools/control/control.py notify || echo "telegram notify failed (non-fatal)"
          git add production/control
          git diff --cached --quiet && exit 0
          git config user.name "control[bot]"
          git config user.email "control@users.noreply.github.com"
          git commit -qm "control: telegram sent"
          for n in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
      - name: Mirror state to D1
        if: always()
        continue-on-error: true
        env:
          CLOUDFLARE_D1_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
        run: |
          git pull --rebase -q origin master || true
          python3 -P tools/state_mirror.py push && python3 -P tools/state_mirror.py compare
