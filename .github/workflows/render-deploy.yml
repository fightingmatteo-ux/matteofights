# Redeploys the Modal render app (tools/render/modal_app.py) whenever it or the modules it copies change.
name: Deploy render app
on:
  push:
    branches: [master]
    paths: ["tools/render/**", "tools/state.py", "tools/r2.py", "tools/cloud/cloud.json"]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q modal
      - env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal deploy tools/render/modal_app.py
