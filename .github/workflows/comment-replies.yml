# Comment replies: Claude Code on Matteo's subscription (CLAUDE_CODE_OAUTH_TOKEN, no API key) answers new comments on
# recent reels in his voice (tools/instagram/reply-voice.md), posts the replies, copies them to Telegram.
# Started by the comment webhook (signup-site/functions/api/ig-webhook.js: max 1 start per 90 s, 48 per day) so a reply
# lands in about a minute, plus a 3-hourly safety run. Stops in seconds when nothing is new.
# Cost guards (Matteo 2026-11-01: "make sure none of my cards get charged"): webhook starts only while the repo is
# public (unlimited free Actions minutes); Haiku, one call per run, max 60 comments; if the subscription limit is hit
# the run posts nothing and records nothing (those comments get answered later). Kill switch: repo variable AUTO_REPLY=off.
# Runnable on the Modal backup (no `uses:` actions besides checkout/setup-node).
name: Comment replies
on:
  schedule:
    - cron: "40 */3 * * *"
  workflow_dispatch:
    inputs:
      source:
        description: who started it (webhook | manual)
        required: false
        default: manual
permissions:
  contents: write
  actions: write
concurrency:
  group: comment-replies
  cancel-in-progress: false
jobs:
  reply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      CLOUDFLARE_D1_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
      AUTO_REPLY: ${{ vars.AUTO_REPLY }}
      SOURCE: ${{ inputs.source }}
      REPO_PRIVATE: ${{ github.event.repository.private }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: New comments?
        id: c
        run: |
          echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"
          if [ "$AUTO_REPLY" = "off" ]; then echo "auto replies off"; echo "n=0" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$SOURCE" = "webhook" ] && [ "$REPO_PRIVATE" = "true" ]; then
            echo "repo is private: per-comment runs would use paid minutes, waiting for the 3-hourly run"; echo "n=0" >> "$GITHUB_OUTPUT"; exit 0
          fi
          python3 -P tools/instagram/comment_replies.py collect work/pending.json
      - if: steps.c.outputs.n != '0'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Write the replies (Claude Code, Haiku, Matteo's subscription)
        if: steps.c.outputs.n != '0'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          npm install -g --silent @anthropic-ai/claude-code
          python3 -P tools/instagram/comment_replies.py prompt work/pending.json work/prompt.txt
          claude -p --model haiku --max-turns 1 < work/prompt.txt > work/replies.txt 2> work/claude.err || { echo "claude failed (limit?):"; head -c 500 work/claude.err; : > work/replies.txt; }
          head -c 3000 work/replies.txt
      - name: Post them + remember
        if: steps.c.outputs.n != '0'
        run: |
          python3 -P tools/instagram/comment_replies.py post work/pending.json work/replies.txt
          git config user.name "comment-replies[bot]"
          git config user.email "control@users.noreply.github.com"
          git add production/state/ig_reply.json 2>/dev/null || true
          git diff --cached --quiet || { git commit -qm "comment replies: $(date -u +%FT%H:%MZ)"; git pull -q --rebase --autostash; git push -q; }
      - name: Comments that came in while this ran
        if: inputs.source == 'webhook' && env.AUTO_REPLY != 'off' && env.REPO_PRIVATE != 'true'
        env:
          STARTED: ${{ steps.c.outputs.started }}
        run: python3 -P tools/instagram/comment_replies.py again "$STARTED"
