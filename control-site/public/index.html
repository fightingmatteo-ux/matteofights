<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0B0D">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>Matteo Fights Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip" href="#view">Skip to content</a>
<header class="bar">
  <a class="mark" href="#" data-tab="home" aria-label="Matteo Fights control, home">MATTEO FIGHTS</a>
  <p class="bar-meta"><span id="nyclock" class="ny" title="Current time in New York"></span><span id="fresh" class="fresh"></span></p>
</header>

<nav class="nav" aria-label="Sections">
  <button data-tab="home"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="7.5"/><path d="M12 9.5V13l2.5 1.5M10 3h4"/></svg><span>Home</span></button>
  <button data-tab="reels"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3.5" width="7" height="12" rx="1.5"/><rect x="13" y="3.5" width="7" height="12" rx="1.5"/><path d="M4 19.5h16"/></svg><span>Reels</span></button>
  <button data-tab="results"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h9M4 12h15M4 18h6"/><path d="M15 4v4M15 16v4" opacity=".5"/></svg><span>Results</span></button>
  <button data-tab="decide"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h14v10H9l-4 4z"/></svg><span>Decide</span><b id="badge" class="badge" hidden></b></button>
  <button data-tab="activity"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l3-7 4 14 3-7h4"/></svg><span>Activity</span></button>
</nav>

<main id="view" tabindex="-1"><div class="skeleton" aria-label="Loading"><span></span><span></span><span></span></div></main>

<dialog id="sheet" aria-labelledby="sheet-title"></dialog>
<div id="undo" class="undo" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<p id="sr" class="sr" aria-live="assertive"></p>
<script src="app.js"></script>
</body>
</html>
